name: .NET Multi-RID Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    outputs:
      valid: ${{ steps.version.outputs.valid }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      asset_suffix: ${{ steps.version.outputs.asset_suffix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parse release version
        id: version
        shell: bash
        run: |
          TITLE="$(git log -1 --pretty=%s)"

          echo "Commit title: $TITLE"

          if [[ "$TITLE" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"

            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "release_name=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "asset_suffix=" >> "$GITHUB_OUTPUT"

          elif [[ "${TITLE,,}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)[[:space:]-]+beta$ ]]; then
            VERSION="${BASH_REMATCH[1]}"

            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}-beta" >> "$GITHUB_OUTPUT"
            echo "release_name=v${VERSION} Beta" >> "$GITHUB_OUTPUT"
            echo "asset_suffix=-beta" >> "$GITHUB_OUTPUT"

          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi


  publish:
    needs: check-version

    if: needs.check-version.outputs.valid == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        rid:
          - win-x86
          - win-x64
          - linux-x64
          - linux-arm
          - linux-arm64
          - osx-x64
          - osx-arm64

    env:
      PROJECT_PATH: "Pelican Keeper/Pelican Keeper.csproj"
      APP_NAME: "Pelican-Keeper"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore
        run: |
          dotnet restore \
            "$PROJECT_PATH" \
            -r "${{ matrix.rid }}"

      - name: Publish
        shell: bash
        run: |
          OUTDIR="dist/${{ matrix.rid }}"

          mkdir -p "$OUTDIR"

          dotnet publish \
            "$PROJECT_PATH" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --no-restore \
            --nologo \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:EnableCompressionInSingleFile=true \
            -o "$OUTDIR"

      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          SUFFIX="${{ needs.check-version.outputs.asset_suffix }}"

          NAME="${APP_NAME}-v${VERSION}${SUFFIX}-${{ matrix.rid }}.zip"

          cd "dist/${{ matrix.rid }}"
          zip -r "../$NAME" .

          echo "ASSET=dist/$NAME" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET }}


  create-release:
    needs:
      - check-version
      - publish

    if: needs.check-version.outputs.valid == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          RELEASE_NAME: ${{ needs.check-version.outputs.release_name }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}

        shell: bash
        run: |
          ARGS=(
            "$TAG"
            release-assets/*.zip
            --title "$RELEASE_NAME"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"